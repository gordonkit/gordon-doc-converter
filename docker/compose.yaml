services:
  standalone-lo:
    profiles: ["standalone-lo"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.standalone-lo
    environment:
      GORDON_DOC_API_KEY: ${GORDON_DOC_API_KEY:?set GORDON_DOC_API_KEY}
    ports: ["8000:8000"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    security_opt: ["no-new-privileges:true"]

  gateway-gotenberg:
    profiles: ["gateway-gotenberg"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway-gotenberg
    environment:
      GORDON_DOC_API_KEY: ${GORDON_DOC_API_KEY:?set GORDON_DOC_API_KEY}
      GORDON_DOC_GOTENBERG_URL: http://gotenberg:3000
    ports: ["8000:8000"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      gotenberg:
        condition: service_healthy

  gotenberg:
    profiles: ["gateway-gotenberg"]
    image: gotenberg/gotenberg:8
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    security_opt: ["no-new-privileges:true"]

  cli:
    profiles: ["cli"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.cli
    volumes: ["${PWD:-.}:/work"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
