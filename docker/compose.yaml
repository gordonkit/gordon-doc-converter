services:
  standalone-lo:
    profiles: ["standalone-lo"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gordonkit/gordon-doc-converter:local
    command: ["api"]
    environment:
      GORDON_DOC_API_KEY: ${GORDON_DOC_API_KEY:?set GORDON_DOC_API_KEY}
    ports: ["8000:8000"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    networks: ["gordon-doc"]

  gateway-gotenberg:
    profiles: ["gateway-gotenberg"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gordonkit/gordon-doc-converter:local
    command: ["api"]
    environment:
      GORDON_DOC_API_KEY: ${GORDON_DOC_API_KEY:?set GORDON_DOC_API_KEY}
      GORDON_DOC_GOTENBERG_URL: http://gotenberg:3000
    ports: ["8000:8000"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      gotenberg:
        condition: service_healthy
    networks: ["gordon-doc"]

  gotenberg:
    profiles: ["gateway-gotenberg"]
    image: gotenberg/gotenberg:8
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    networks: ["gordon-doc"]

  cli:
    profiles: ["cli"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gordonkit/gordon-doc-converter:local
    volumes: ["${PWD:-.}:/work"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    networks: ["gordon-doc"]

networks:
  gordon-doc:
    name: gordon-doc
