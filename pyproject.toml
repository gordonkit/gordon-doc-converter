[project]
name = "gordon-doc-converter"
version = "0.8.0"
description = "Diagnosable multi-engine DOCX-to-PDF conversion orchestration."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "GordonKit contributors" }]
keywords = ["docx", "pdf", "document-conversion"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pypdf>=5.0,<7",
    "pyyaml>=6.0.2,<7",
    "typer>=0.16,<1",
]

[project.urls]
Documentation = "https://docs.gordonkit.com/"
Changelog = "https://github.com/gordonkit/gordon-doc-converter/blob/main/CHANGELOG.md"
Issues = "https://github.com/gordonkit/gordon-doc-converter/issues"
Repository = "https://github.com/gordonkit/gordon-doc-converter"

[project.scripts]
gordon-doc = "gordon_doc_converter.cli:app"

[project.optional-dependencies]
word = ["pywin32>=308; sys_platform == 'win32'"]
gotenberg = ["httpx>=0.27,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
images = [
    "pillow>=12.3,<13",
    "pypdfium2>=5.12,<6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "ruff",
    "types-pyyaml>=6.0.12.20250516",
]

[tool.uv]
required-version = ">=0.12,<0.13"

[tool.hatch.build.targets.wheel]
packages = ["src/gordon_doc_converter"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "pypdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PIL.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests requiring an installed external conversion engine",
]
