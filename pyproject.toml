[project]
name = "gordon-doc-converter"
version = "0.1.0"
description = "Diagnosable multi-engine DOCX-to-PDF conversion orchestration."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["docx", "pdf", "document-conversion"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pypdf>=5.0,<7",
]

[project.optional-dependencies]
word = ["pywin32>=308; sys_platform == 'win32'"]
gotenberg = ["httpx>=0.27,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv]
required-version = ">=0.12,<0.13"

[tool.hatch.build.targets.wheel]
packages = ["src/gordon_doc_converter"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "pypdf.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests requiring an installed external conversion engine",
]
