name: CodeQL

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "docs-src/src/**"
      - "docs-src/swagger/**"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 3"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4