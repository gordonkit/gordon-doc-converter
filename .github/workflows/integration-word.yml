name: Microsoft Word integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: [self-hosted, windows, word]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --extra word --locked
      - run: >-
          uv run pytest -m integration
          tests/integration/word_com
          tests/integration/test_service.py
