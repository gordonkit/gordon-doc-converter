name: TestPyPI release rehearsal

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which release path to rehearse
        type: choice
        default: all
        options:
          - all
          - pypi
          - containers

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    if: contains(fromJSON('["all", "pypi"]'), inputs.target)
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gordon-doc-converter
    env:
      SOURCE_DATE_EPOCH: "946684800"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --dev --locked
      - id: release
        name: Validate release metadata
        shell: bash
        run: echo "version=$(uv run python scripts/check_release.py)" >> "$GITHUB_OUTPUT"
      - run: uv build --out-dir dist
      - name: Check wheel in a clean virtual environment
        run: uv run python scripts/check_package.py dist/*.whl
      - name: Publish to TestPyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Download the published wheel from TestPyPI
        run: >-
          python -m pip download
          --disable-pip-version-check
          --no-deps
          --only-binary=:all:
          --index-url https://test.pypi.org/simple/
          --dest testpypi-dist
          gordon-doc-converter==${{ steps.release.outputs.version }}
      - name: Check the wheel downloaded from TestPyPI
        run: uv run python scripts/check_package.py testpypi-dist/*.whl
  # docker/login-action and docker/build-push-action are otherwise reached only by a
  # real tag, so a version bump to either lands unexercised. This runs the container
  # release path as far as it can go without publishing anything: the image is built
  # but never pushed, and no tag is created.
  rehearse-containers:
    if: contains(fromJSON('["all", "containers"]'), inputs.target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_NAMESPACE"
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: metadata
        name: Generate image metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE }}/gordon-doc-converter
          tags: type=raw,value=rehearsal
      - name: Build the image without publishing it
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
