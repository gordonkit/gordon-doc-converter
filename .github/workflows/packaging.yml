name: Packaging

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "946684800"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --locked
      - run: uv build --out-dir build-one
      - run: uv build --out-dir build-two
      - run: uv run python scripts/compare_builds.py build-one build-two
      - name: Check wheel in a clean virtual environment
        run: uv run python scripts/check_package.py build-one/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: build-one/*
          if-no-files-found: error
