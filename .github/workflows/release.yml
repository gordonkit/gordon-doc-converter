name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [standalone-lo, gateway-gotenberg]
    env:
      GORDON_DOC_API_KEY: smoke-token
    steps:
      - uses: actions/checkout@v4
      - name: Start ${{ matrix.profile }} profile
        run: >-
          docker compose -f docker/compose.yaml
          --profile ${{ matrix.profile }} up --build --detach --wait
      - name: Smoke CLI entry point
        run: docker compose -f docker/compose.yaml --profile cli run --rm cli version
      - name: Convert DOCX to PDF
        run: >-
          python docker/smoke.py
          --token smoke-token
          --docx tests/fixtures/docx/cjk/a4-portrait.docx
      - name: Show service logs
        if: failure()
        run: docker compose -f docker/compose.yaml logs
      - name: Stop services
        if: always()
        run: >-
          docker compose -f docker/compose.yaml
          --profile ${{ matrix.profile }} down --volumes

  build-and-publish:
    needs: container-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gordon-doc-converter
    env:
      SOURCE_DATE_EPOCH: "946684800"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --all-extras --locked
      - run: uv run python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build --out-dir build-one
      - run: uv build --out-dir build-two
      - run: uv run python scripts/compare_builds.py build-one build-two
      - name: Check wheel in a clean virtual environment
        run: uv run python scripts/check_package.py build-one/*.whl
      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "build-one/*"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build-one/* --draft --generate-notes --verify-tag
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: build-one/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  publish-containers:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_NAMESPACE"
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: metadata
        name: Generate image metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE }}/gordon-doc-converter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
