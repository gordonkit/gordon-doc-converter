name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gordon-doc-converter
    env:
      SOURCE_DATE_EPOCH: "946684800"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.x"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --locked
      - run: uv run python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build --out-dir build-one
      - run: uv build --out-dir build-two
      - run: uv run python scripts/compare_builds.py build-one build-two
      - name: Check wheel in a clean virtual environment
        run: uv run python scripts/check_package.py build-one/*.whl
      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "build-one/*"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build-one/* --draft --generate-notes --verify-tag
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: build-one/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
