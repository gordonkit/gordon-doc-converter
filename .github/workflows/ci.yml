name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --dev --extra api --locked
      - run: npm ci
      - run: npm run openapi:check
      - run: npx tsc --project docs-src/tsconfig.json
      - run: npm run build
      - run: git diff --exit-code -- docs docs-src/public/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: docs/
          if-no-files-found: error

  deploy-documentation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, documentation]
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages-production
      url: https://docs.gordonkit.com/
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: documentation-site
          path: docs
      - name: Deploy documentation to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy docs
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
