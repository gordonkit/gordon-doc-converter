name: CJK compatibility

on:
  pull_request:
    paths:
      - "scripts/generate_cjk_fixtures.py"
      - "tests/fixtures/docx/cjk/**"
      - "tests/integration/libreoffice/test_cjk_fixtures.py"
      - ".github/workflows/cjk-compatibility.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libreoffice-cjk-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice Writer and open CJK fonts
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libreoffice-writer fonts-noto-cjk
      - run: uv sync --dev --locked
      - run: uv run python scripts/generate_cjk_fixtures.py --check
      - run: uv run pytest -m integration tests/integration/libreoffice/test_cjk_fixtures.py
